name: Release v0.0.7 Refined UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.0.7-final.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-validate-release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: v0.0.7
      PORTABLE_NAME: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip
      VALIDATED_RUN_ID: '34794644131'
      VALIDATED_ARTIFACT: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64
      VALIDATED_ZIP_SHA256: 36e161e4ce27103b6668a4471fe381b03ec28c1b6231a9fd137fa2672cfd9ede
      VALIDATED_ZIP_BYTES: '477381768'
      EXPECTED_FFMPEG_SHA256: 91678b935eb52cc740249474574b6042768b744c622347f28a1b487e1ed29915
      EXPECTED_FFPROBE_SHA256: c42ada47df746e3788e2ba3ed2f7af07662a58f9088f9894e1b14d3d5c432263

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Compile and test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MONITOR_DISABLE_WEATHER: '1'
        run: |
          $ErrorActionPreference='Stop'
          python -m compileall -q src tests scripts run.py
          python -m pytest -q

      - name: Capture 11 refined screens
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          MONITOR_DISABLE_WEATHER: '1'
        run: |
          $ErrorActionPreference='Stop'
          python scripts/capture_refined_layouts.py
          $expected=@('inicio','noticias','videos','demandas','fontes','historico','termos','configuracoes','editor-pdf','extrator-videos','editor-video')
          foreach($name in $expected){
            $file="artifacts/refined-ui/$name-1721x914.png"
            if(-not (Test-Path $file)){ throw "Captura ausente: $file" }
          }

      - name: Download validated portable source for audited FFmpeg binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VALIDATED_ARTIFACT }}
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: ${{ env.VALIDATED_RUN_ID }}
          github-token: ${{ github.token }}
          path: validated-portable

      - name: Materialize audited FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem validated-portable -Recurse -File -Filter $env:PORTABLE_NAME | Select-Object -First 1
          if(-not $zip){ throw 'ZIP validado anterior não encontrado.' }
          $zipHash=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zipHash -ne $env:VALIDATED_ZIP_SHA256){ throw "ZIP validado divergente: $zipHash" }
          if("$($zip.Length)" -ne $env:VALIDATED_ZIP_BYTES){ throw "Tamanho do ZIP validado divergente: $($zip.Length)" }
          $extract=Join-Path $env:RUNNER_TEMP 'validated-portable-v007-source'
          if(Test-Path $extract){ Remove-Item $extract -Recurse -Force }
          Expand-Archive $zip.FullName $extract -Force
          $root=Get-ChildItem $extract -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe') } | Select-Object -First 1
          if(-not $root){ throw 'Raiz do portable validado não encontrada.' }
          $ff=Join-Path $root.FullName 'bin/ffmpeg.exe'
          $fp=Join-Path $root.FullName 'bin/ffprobe.exe'
          $ffHash=(Get-FileHash $ff -Algorithm SHA256).Hash.ToLowerInvariant()
          $fpHash=(Get-FileHash $fp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ffHash -ne $env:EXPECTED_FFMPEG_SHA256){ throw "FFmpeg auditado divergente: $ffHash" }
          if($fpHash -ne $env:EXPECTED_FFPROBE_SHA256){ throw "FFprobe auditado divergente: $fpHash" }
          $audited=Join-Path $env:RUNNER_TEMP 'audited-ffmpeg-v007'
          New-Item -ItemType Directory -Force $audited | Out-Null
          Copy-Item $ff (Join-Path $audited 'ffmpeg.exe') -Force
          Copy-Item $fp (Join-Path $audited 'ffprobe.exe') -Force
          "MONITOR_VALIDATED_FFMPEG_DIR=$audited" >> $env:GITHUB_ENV

      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/build_portable.ps1

      - name: Validate freshly built portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          if(-not (Test-Path $zip)){ throw 'ZIP portable não encontrado.' }
          ./scripts/validate_portable.ps1 -ZipPath $zip

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force publish | Out-Null
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          Copy-Item $zip (Join-Path publish $env:PORTABLE_NAME) -Force
          if(Test-Path "$zip.sha256"){ Remove-Item "$zip.sha256" -Force }
          if(Test-Path 'portable/FFMPEG_SOURCE_INFO.txt'){
            Copy-Item 'portable/FFMPEG_SOURCE_INFO.txt' 'publish/FFMPEG_SOURCE_INFO.txt' -Force
          }
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "RELEASE_SHA256=$hash"
          Write-Host "RELEASE_BYTES=$((Get-Item $zip).Length)"
          $zips=@(Get-ChildItem publish -File -Filter '*.zip')
          if($zips.Count -ne 1){ throw "A release deve conter exatamente um ZIP, encontrados: $($zips.Count)" }
          $hashFiles=@(Get-ChildItem publish -File | Where-Object { $_.Name -match '(?i)sha256|\.sha$' })
          if($hashFiles.Count -ne 0){ throw 'Arquivo SHA separado não deve ser publicado.' }

      - name: Publish GitHub Release v0.0.7
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if(gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null){
            throw "Release $env:RELEASE_TAG já existe; não sobrescrever."
          }
          $zip=(Resolve-Path "publish/$env:PORTABLE_NAME").Path
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $body=@"
          Monitor de Notícias Python 0.0.7 — Windows Portable x64

          Esta versão consolida o refinamento visual do Monitor no novo repositório, preservando a lógica e os motores existentes.

          Principais ajustes:
          - interface clara padronizada em Início, Notícias, Vídeos, Demandas, Fontes, Histórico, Termos e Configurações
          - sidebar azul-marinho e cabeçalho compacto compartilhado
          - Editor de PDF com estado vazio claro e controles refinados
          - Extrator de Vídeos alinhado ao novo padrão visual
          - Editor de Vídeo incorporado ao Monitor, com painéis e timeline em tema claro
          - densidade, margens, cards, badges e estados vazios refinados
          - captura automática das 11 telas usando exatamente o mesmo acabamento visual do runtime
          - workflow de testes Windows/Ubuntu mantido ativo

          Validação:
          - compileall aprovado
          - suíte pytest completa aprovada
          - 11 telas capturadas no Windows
          - portable gerado em Windows x64 / Python 3.12
          - smoke e validação do portable executados antes da publicação
          - FFmpeg/FFprobe preservados byte-a-byte dos binários auditados
          - SHA-256 do ZIP: $hash

          A release publica um único ZIP portable. Nenhum arquivo .sha256 separado é anexado.
          "@
          $assets=@($zip)
          if(Test-Path 'publish/FFMPEG_SOURCE_INFO.txt'){ $assets += (Resolve-Path 'publish/FFMPEG_SOURCE_INFO.txt').Path }
          $assets += Get-ChildItem 'artifacts/refined-ui' -File -Filter '*.png' | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'Monitor de Notícias Python 0.0.7' `
            --notes $body
          if($LASTEXITCODE -ne 0){ throw 'Falha ao criar release v0.0.7.' }
          Write-Host 'RELEASE_CREATED=v0.0.7'
