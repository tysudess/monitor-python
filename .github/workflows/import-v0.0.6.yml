name: Import v0.0.6 source

on:
  push:
    branches:
      - import-v0.0.6
    paths:
      - .github/workflows/import-v0.0.6.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          ref: import-v0.0.6
          fetch-depth: 0

      - name: Checkout Monitor v0.0.6 source
        uses: actions/checkout@v4
        with:
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          ref: v0.0.6
          path: source
          fetch-depth: 1

      - name: Replace target contents with v0.0.6
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' source/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import complete source from Monitor Python v0.0.6"
          git push origin HEAD:import-v0.0.6
