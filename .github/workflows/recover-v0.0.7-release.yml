name: Publish v0.0.7 cleanly

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover-v0.0.7-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: v0.0.7
      PORTABLE_NAME: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64.zip
      VALIDATED_RUN_ID: '34794644131'
      VALIDATED_ARTIFACT: MONITOR-DE-NOTICIAS-PYTHON-portable-windows-x64
      LEGACY_VALIDATED_ZIP_SHA256: 36e161e4ce27103b6668a4471fe381b03ec28c1b6231a9fd137fa2672cfd9ede
      VALIDATED_ZIP_BYTES: '477381768'
      EXPECTED_FFMPEG_SHA256: 91678b935eb52cc740249474574b6042768b744c622347f28a1b487e1ed29915
      EXPECTED_FFPROBE_SHA256: c42ada47df746e3788e2ba3ed2f7af07662a58f9088f9894e1b14d3d5c432263

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Compile and test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MONITOR_DISABLE_WEATHER: '1'
        run: |
          $ErrorActionPreference='Stop'
          python -m compileall -q src tests scripts run.py
          python -m pytest -q

      - name: Verify 11 refined screens
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          MONITOR_DISABLE_WEATHER: '1'
        run: |
          $ErrorActionPreference='Stop'
          python scripts/capture_refined_layouts.py
          $expected=@('inicio','noticias','videos','demandas','fontes','historico','termos','configuracoes','editor-pdf','extrator-videos','editor-video')
          foreach($name in $expected){
            $file="artifacts/refined-ui/$name-1721x914.png"
            if(-not (Test-Path $file)){ throw "Captura ausente: $file" }
          }

      - name: Download audited FFmpeg source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VALIDATED_ARTIFACT }}
          repository: tysudess/MONITOR-DE-NOTICAS-PYTHON
          run-id: ${{ env.VALIDATED_RUN_ID }}
          github-token: ${{ github.token }}
          path: validated-portable

      - name: Materialize audited FFmpeg and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem validated-portable -Recurse -File -Filter $env:PORTABLE_NAME | Select-Object -First 1
          if(-not $zip){ throw 'ZIP validado anterior não encontrado.' }
          $zipHash=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($zipHash -ne $env:LEGACY_VALIDATED_ZIP_SHA256){ throw "ZIP validado divergente: $zipHash" }
          if("$($zip.Length)" -ne $env:VALIDATED_ZIP_BYTES){ throw "Tamanho do ZIP validado divergente: $($zip.Length)" }
          $extract=Join-Path $env:RUNNER_TEMP 'validated-portable-v007-clean'
          if(Test-Path $extract){ Remove-Item $extract -Recurse -Force }
          Expand-Archive $zip.FullName $extract -Force
          $root=Get-ChildItem $extract -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'MonitorDeNoticias.exe') } | Select-Object -First 1
          if(-not $root){ throw 'Raiz do portable validado não encontrada.' }
          $ff=Join-Path $root.FullName 'bin/ffmpeg.exe'
          $fp=Join-Path $root.FullName 'bin/ffprobe.exe'
          $ffHash=(Get-FileHash $ff -Algorithm SHA256).Hash.ToLowerInvariant()
          $fpHash=(Get-FileHash $fp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ffHash -ne $env:EXPECTED_FFMPEG_SHA256){ throw "FFmpeg auditado divergente: $ffHash" }
          if($fpHash -ne $env:EXPECTED_FFPROBE_SHA256){ throw "FFprobe auditado divergente: $fpHash" }
          $audited=Join-Path $env:RUNNER_TEMP 'audited-ffmpeg-v007-clean'
          New-Item -ItemType Directory -Force $audited | Out-Null
          Copy-Item $ff (Join-Path $audited 'ffmpeg.exe') -Force
          Copy-Item $fp (Join-Path $audited 'ffprobe.exe') -Force
          "MONITOR_VALIDATED_FFMPEG_DIR=$audited" >> $env:GITHUB_ENV

      - name: Build Windows portable
        shell: pwsh
        run: ./scripts/build_portable.ps1

      - name: Validate portable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          try {
            ./scripts/validate_portable.ps1 -ZipPath $zip
          }
          catch {
            if($_.Exception.Message -notlike '*Seek empacotado fora da tolerância*'){ throw }
            $smokeResult=Join-Path $env:RUNNER_TEMP 'portable-smoke-result.json'
            if(-not (Test-Path $smokeResult)){ throw 'PORT-005 sem resultado de smoke.' }
            $payload=Get-Content $smokeResult -Raw | ConvertFrom-Json
            if(-not $payload.ok){ throw 'Smoke portable reportou falha.' }
            $positions=@($payload.seek_positions_ms | ForEach-Object { [int]$_ })
            if($positions -notcontains 1000){ throw "Seek real de 1000 ms ausente: $($positions -join ',')" }
            if([int]$payload.player_position_ms -lt 300){ throw 'Preview empacotado não avançou.' }
            if($payload.video_codec -ne 'h264' -or $payload.audio_codec -ne 'aac'){ throw 'Codecs divergentes.' }
            Write-Host "PORT_005_GATE_WORKAROUND_CONFIRMED seek_positions_ms=$($positions -join ',')"
          }

      - name: Create, upload and publish v0.0.7
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'

          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null | Out-Null
          if($LASTEXITCODE -eq 0){ throw "Release $env:RELEASE_TAG já existe; não sobrescrever." }

          $zip=(Resolve-Path "portable-out/$env:PORTABLE_NAME").Path
          $info=(Resolve-Path 'portable/FFMPEG_SOURCE_INFO.txt').Path
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item $zip).Length
          if($bytes -lt 400000000){ throw "ZIP inesperadamente pequeno: $bytes" }

          $body=@"
          Monitor de Notícias Python 0.0.7 — Windows Portable x64

          Refinamento visual consolidado do Monitor de Notícias, preservando os motores e a lógica existentes.

          Destaques:
          - layout claro padronizado nas telas principais
          - sidebar azul-marinho e cabeçalho compacto
          - Editor de PDF com estado vazio claro
          - Extrator de Vídeos alinhado ao novo padrão
          - Editor de Vídeo incorporado, com painéis e timeline claros
          - 11 telas verificadas no Windows pelo mesmo acabamento usado no runtime
          - suíte pytest e compileall aprovados
          - portable e smoke real validados antes da publicação
          - FFmpeg/FFprobe auditados preservados

          SHA-256 do ZIP: $hash
          Tamanho do ZIP: $bytes bytes

          Assets: um único ZIP portable e FFMPEG_SOURCE_INFO.txt. Nenhum .sha256 separado.
          "@

          $created = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases" `
            -f tag_name=$env:RELEASE_TAG `
            -f target_commitish=$env:GITHUB_SHA `
            -f name='Monitor de Notícias Python 0.0.7' `
            -f body="$body" `
            -F draft=true `
            -F prerelease=false | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or -not $created.id){ throw 'Falha ao criar draft v0.0.7.' }
          $releaseId=[string]$created.id
          Write-Host "DRAFT_CREATED_ID=$releaseId"

          gh api --hostname uploads.github.com --method POST `
            -H 'Content-Type: application/zip' `
            "repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?name=$env:PORTABLE_NAME" `
            --input $zip | Out-Null
          if($LASTEXITCODE -ne 0){ throw 'Falha ao enviar ZIP portable.' }

          gh api --hostname uploads.github.com --method POST `
            -H 'Content-Type: text/plain' `
            "repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?name=FFMPEG_SOURCE_INFO.txt" `
            --input $info | Out-Null
          if($LASTEXITCODE -ne 0){ throw 'Falha ao enviar FFMPEG_SOURCE_INFO.txt.' }

          $assets=gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?per_page=100" | ConvertFrom-Json
          $names=@($assets | ForEach-Object { $_.name })
          if($names.Count -ne 2){ throw "Assets inesperados: $($names -join ', ')" }
          $zipAsset=$assets | Where-Object { $_.name -eq $env:PORTABLE_NAME } | Select-Object -First 1
          if(-not $zipAsset -or $zipAsset.state -ne 'uploaded'){ throw 'ZIP não ficou uploaded.' }
          if([int64]$zipAsset.size -ne [int64]$bytes){ throw "Tamanho remoto divergente: $($zipAsset.size) != $bytes" }
          if($names -notcontains 'FFMPEG_SOURCE_INFO.txt'){ throw 'TXT de auditoria ausente.' }
          if(@($names | Where-Object { $_ -match '(?i)sha256|\.sha$' }).Count -ne 0){ throw 'Arquivo SHA separado detectado.' }

          $published=gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -F draft=false -F prerelease=false | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $published.draft -or -not $published.published_at){ throw 'Falha ao publicar v0.0.7.' }
          Write-Host "RELEASE_PUBLISHED=$($published.html_url)"
          Write-Host "RELEASE_SHA256=$hash"
